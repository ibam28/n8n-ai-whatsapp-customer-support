services:

  postgres:
    image: postgres:16
    container_name: wa-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - evolution-network

  redis:
    image: redis:7-alpine
    container_name: wa-redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    networks:
      - evolution-network

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: wa-evolution

    restart: unless-stopped

    depends_on:
      - postgres
      - redis

    ports:
      - "8082:8080"

    env_file:
      - .env.evolution

    volumes:
      - evolution_instances:/evolution/instances

    networks:
      - evolution-network
      - ai-network

volumes:

  postgres_data:

  redis_data:

  evolution_instances:

networks:

  evolution-network:

  ai-network:
    external: true