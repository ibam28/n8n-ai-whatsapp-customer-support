services:

  mysql:
    image: mysql:8.4

    container_name: wa-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - whatsapp-network

  adminer:
    image: adminer:5

    container_name: wa-adminer

    restart: unless-stopped

    ports:
      - "8081:8080"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - whatsapp-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: wa-php

    restart: unless-stopped

    ports:
      - "8080:80"

    environment:
      TZ: ${TZ}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    volumes:
      - ./api:/var/www/html

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - whatsapp-network

volumes:
  mysql_data:

networks:
  whatsapp-network: